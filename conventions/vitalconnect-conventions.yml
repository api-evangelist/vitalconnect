scope: >-
  What can honestly be said about VitalConnect's runtime semantics from public material. The
  request/response contract of the VitalConnect Platform API lives in MAN-001, which is not
  public, so every field below describes either the publicly documented VistaCenter webhook
  surface or an explicit "not published". Nothing is inferred from a spec, because there is no
  published spec to infer from.
surfaces_covered:
  - VistaCenter outbound webhooks (asyncapi/vitalconnect-vistacenter-webhooks.yml)
authentication:
  style: undocumented
  note: >-
    Webhook configuration is performed by an authenticated VistaCenter administrator, but the
    guide documents no signing secret, shared token, mTLS or other authentication on the
    outbound POST itself, and no authentication scheme for the platform API.
  see: null
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  retention: null
  note: >-
    No replay-protection mechanism is documented anywhere in the public material. Webhook
    deliveries carry an "event ID", which a subscriber could use to de-duplicate on its own
    side, but VitalConnect documents no delivery guarantee, no retry policy and no
    idempotency key for any request it accepts, so there is no provider-side contract to record.
pagination:
  style: undocumented
  params: []
  response_fields: []
field_expansion:
  supported: unknown
metadata:
  supported: unknown
request_tracing:
