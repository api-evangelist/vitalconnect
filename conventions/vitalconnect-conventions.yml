  note: An "event ID" accompanies each webhook payload; no request-correlation header is documented.
versioning:
  style: product-release
  note: >-
    Versioning is expressed as product releases (VistaSolution 3.2, VistaPoint 3.6,
    VistaCenter 3.5.4) documented per-revision in the Instructions For Use library. No API
    version identifier, header or URI segment is published.
  see: lifecycle/vitalconnect-lifecycle.yml
