reversibility:
  grade: na
  applies: false
  note: >-
    The only publicly documented surface is outbound webhook delivery — VistaCenter emits
    events to a subscriber-controlled URL. There is no public write operation an integrator can
    invoke against VitalConnect, so there is nothing to reverse, cancel, void or restore. This
    is an honest "not applicable", not a zero. Whether the non-public VitalConnect Platform API
    (MAN-001) exposes reversible writes cannot be established from public material.
  operations: []
  windows: []
dry_run_mode:
  supported: unknown
  note: >-
    The VistaCenter webhook editor exposes a "Send All Current Data" toggle that the guide
    labels internal debugging only and instructs administrators not to use. That is not a
    documented dry-run facility and is recorded here only so the toggle is not mistaken for one.
