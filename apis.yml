apis:
- aid: vitalconnect:vistacenter-webhooks
  name: VistaCenter Webhooks
  description: >-
    VistaCenter, VitalConnect's cloud clinician application, transmits events to third-party
    application servers by POSTing to a subscriber-supplied Target URL. Event classes are patient
    notifications, new patients, new relay devices and relay-device updates; the payload carries
    an event type, an event ID and an object of event-identifying fields. Configured by a
    VistaCenter administrator and documented publicly in MAN-027 Rev. G, the VistaSolution IT
    Administration Guide. This is the only VitalConnect integration surface with public
    first-party documentation — the VitalConnect Platform API itself is documented only in
    MAN-001, which is available on request from the company.
  humanURL: https://vitalconnect.com/docs/man027/MAN-027_RevG_VistaSolution-IT-Admin-Guide.pdf
  image: https://vitalconnect.com/wp-content/uploads/2026/02/VitalConnect%C2%AE-black-276px-center78px.png
  x-baseURL-status: >-
    No baseURL is recorded on purpose. VitalConnect publishes no API host: the IT Administration
    Guide names the platform destination only as the wildcard *.prod.vitalconnect.com, and no
    concrete host under it resolves in public DNS. The webhook surface is outbound in any case —
    VistaCenter POSTs to a subscriber-supplied Target URL, so the base belongs to the subscriber,
    not to VitalConnect. Recorded as missing rather than guessed from the domain.
  position: Producing
  tags:
  - Webhooks
  - Remote Patient Monitoring
  - Cardiac Monitoring
