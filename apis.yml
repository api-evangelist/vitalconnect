aid: vitalconnect
name: VitalConnect
description: >-
  VitalConnect is a San Jose, California medical device company whose VitalPatch biosensor and
  Vista Solution platform deliver continuous wireless remote patient monitoring and mobile
  cardiac telemetry. The single-use adhesive VitalPatch streams up to eleven physiological
  measurements — single-lead ECG, heart rate, heart rate variability, respiratory rate, skin
  temperature, body posture, fall detection and step count — to VistaPoint relay software running
  on a VistaTablet or VistaPhone, and on to the cloud-hosted VistaCenter clinician dashboard used
  for cardiac monitoring, hospital-at-home, inpatient expansion, chronic disease management and
  decentralized clinical trials. The VitalConnect Platform exposes an application programming
  interface documented in MAN-001, the VitalConnect Platform Integration Manual — Developer
  Guide, which the FDA-cleared VitalPatch Instructions For Use direct integrators to request
  directly from the company; no public developer portal, API reference or machine-readable
  specification is published. VistaCenter does publicly document an outbound webhook surface that
  POSTs notification, patient and device events to a customer-configured target URL for EHR,
  billing and alerting integrations. iRhythm Technologies agreed in August 2026 to acquire
  VitalConnect for approximately $287.5 million.
